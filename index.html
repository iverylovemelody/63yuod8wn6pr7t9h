<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="bingbot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="referrer" content="no-referrer">
<title>Private Link Board</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --text:#16181c; --muted:#68717d;
  --line:#dde3e9; --green:#05c311; --green2:#05ad10; --blue:#205997;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif
}
.wrap{max-width:1120px;margin:auto;padding:20px 14px 80px}
.hero{text-align:center;padding:8px 0 18px}
.hero h1{margin:0;color:var(--blue);font-size:30px;font-weight:900}
.hero .sub{margin-top:7px;color:#e25d00;font-size:18px;font-weight:800}
.filters{
  display:flex;gap:9px;overflow-x:auto;padding:2px 2px 12px;
  scrollbar-width:none;position:sticky;top:0;background:rgba(244,246,248,.96);
  z-index:10;backdrop-filter:blur(8px)
}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:0;border-radius:999px;background:#e1e1e1;
  padding:10px 15px;font-size:15px;font-weight:800;color:#171717
}
.chip.active{background:var(--green);color:#fff}
.countline{font-size:13px;color:var(--muted);margin:2px 2px 12px}
.county-block{margin:20px 0 28px}
.county-title{
  font-size:22px;font-weight:900;color:#225592;
  padding:0 0 7px;border-bottom:2px solid #225592;margin-bottom:12px
}
.store-card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  margin:0 0 13px;padding:15px 16px;box-shadow:0 1px 3px rgba(0,0,0,.025)
}
.store-name{font-size:18px;font-weight:900;margin-bottom:5px}
.store-date{font-size:13px;color:#65707c;margin-bottom:9px}
.item-row{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;
  min-height:48px;border-top:1px solid #e6e9ed;padding:8px 0
}
.item-name{font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.draw-btn{
  min-width:58px;text-align:center;text-decoration:none;color:#fff;
  background:var(--green);border-radius:8px;padding:9px 11px;font-size:14px;font-weight:900
}
.draw-btn:active{background:var(--green2)}
.draw-btn.visited{background:#a7a9ad}
.empty{
  background:#fff;border:1px dashed #cbd2d9;border-radius:16px;
  padding:42px 18px;text-align:center;color:var(--muted)
}
.foot{text-align:center;color:#9aa1aa;font-size:11px;margin-top:24px}
@media (max-width:600px){
  .wrap{padding:14px 10px 70px}
  .hero{padding-top:6px}
  .hero h1{font-size:25px}
  .hero .sub{font-size:16px}
  .chip{padding:9px 13px;font-size:14px}
  .county-title{font-size:20px}
  .store-card{padding:13px}
  .store-name{font-size:17px}
  .item-row{gap:8px}
  .item-name{font-size:14px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1 id="headline">最新抽選</h1>
    <div class="sub">下面為目前抽選連結</div>
  </div>

  <div id="filters" class="filters"></div>
  <div id="countline" class="countline"></div>
  <div id="content"></div>

  <div class="foot">此頁設定為不供一般搜尋引擎索引。</div>
</div>

<script src="./d4.js"></script>
<script>
const $ = s => document.querySelector(s);
const countyOrder = ["全部","新北","台北","宜蘭","桃園","新竹","台中","彰化","雲林","高雄","屏東"];
let selected = "全部";

const visitedKey = "draw_visited_" + location.pathname;
const visited = new Set(JSON.parse(localStorage.getItem(visitedKey) || "[]"));

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
  }[m]));
}

function normalize(s){
  return String(s||"")
    .replace(/^Funbox\s*/i,"")
    .replace(/^Fun box\s*/i,"")
    .replace(/\s+/g,"")
    .toLowerCase();
}

const storeMap = new Map();
(STORES || []).forEach(s => {
  storeMap.set(normalize(s.name), s);
});

function getStoreInfo(draw){
  const dn = normalize(draw.store);
  if(storeMap.has(dn)) return storeMap.get(dn);

  let best = null, bestLen = 0;
  for(const s of (STORES || [])){
    const sn = normalize(s.name);
    if((dn.includes(sn) || sn.includes(dn)) && Math.min(sn.length,dn.length) > bestLen){
      best = s;
      bestLen = Math.min(sn.length,dn.length);
    }
  }
  return best || {name:draw.store, county:"其他"};
}

function drawCounty(d){
  return getStoreInfo(d).county || "其他";
}

function uniqueStores(list){
  return new Set(list.map(d=>normalize(d.store))).size;
}

function currentDateLabel(){
  if(!DRAWS || !DRAWS.length) return "";
  const dates = DRAWS.map(d=>String(d.date||"")).filter(Boolean);
  if(!dates.length) return "";
  const first = dates[0];
  const m = first.match(/(?:\d{4}\/)?(\d{1,2})\/(\d{1,2})/);
  return m ? `${Number(m[1])}/${Number(m[2])} 抽選已更新！` : "最新抽選";
}

function countyCount(c){
  const arr = c==="全部" ? DRAWS : DRAWS.filter(d=>drawCounty(d)===c);
  return uniqueStores(arr);
}

function renderFilters(){
  const available = countyOrder.filter(c => c==="全部" || countyCount(c)>0);
  $("#filters").innerHTML = available.map(c =>
    `<button class="chip ${selected===c?"active":""}" data-c="${esc(c)}">${esc(c)} (${countyCount(c)})</button>`
  ).join("");

  document.querySelectorAll(".chip").forEach(b=>{
    b.onclick=()=>{
      selected=b.dataset.c;
      renderFilters();
      render();
    };
  });
}

function groupDraws(list){
  const counties = new Map();

  for(const d of list){
    const info = getStoreInfo(d);
    const county = info.county || "其他";
    if(!counties.has(county)) counties.set(county,new Map());

    const stores = counties.get(county);
    const key = normalize(d.store);
    if(!stores.has(key)){
      stores.set(key,{
        display:d.store || info.name || "未命名門市",
        dates:[],
        items:[]
      });
    }
    const st = stores.get(key);
    if(d.date && !st.dates.includes(d.date)) st.dates.push(d.date);
    st.items.push(d);
  }
  return counties;
}

function countySort(a,b){
  const ia = countyOrder.indexOf(a), ib = countyOrder.indexOf(b);
  return (ia<0?999:ia)-(ib<0?999:ib);
}

function render(){
  if(!Array.isArray(DRAWS) || DRAWS.length===0){
    $("#headline").textContent="最新抽選";
    $("#countline").textContent="";
    $("#content").innerHTML=`<div class="empty"><b>目前沒有抽選資料</b><br><br>自動更新完成後會直接出現在這裡。</div>`;
    return;
  }

  $("#headline").textContent=currentDateLabel();

  const list = selected==="全部" ? DRAWS : DRAWS.filter(d=>drawCounty(d)===selected);
  $("#countline").textContent = `${uniqueStores(list)} 家門市・${list.length} 個抽選連結`;

  const grouped = groupDraws(list);
  const countyNames = [...grouped.keys()].sort(countySort);

  $("#content").innerHTML = countyNames.map(county=>{
    const stores = [...grouped.get(county).values()];
    const cards = stores.map(st=>{
      const dateText = st.dates.length ? `抽選時間：${esc(st.dates.join("、"))}` : "";
      const rows = st.items.map(d=>{
        const was = visited.has(d.url);
        return `<div class="item-row">
          <div class="item-name">${esc(d.item || "抽選")}</div>
          <a class="draw-btn ${was?"visited":""}" href="${esc(d.url)}"
             target="_blank" rel="noreferrer noopener" data-url="${esc(d.url)}">抽選</a>
        </div>`;
      }).join("");
      return `<div class="store-card">
        <div class="store-name">${esc(st.display)}</div>
        ${dateText ? `<div class="store-date">${dateText}</div>` : ""}
        ${rows}
      </div>`;
    }).join("");

    return `<section class="county-block">
      <div class="county-title">${esc(county)}</div>
      ${cards}
    </section>`;
  }).join("");

  document.querySelectorAll(".draw-btn").forEach(a=>{
    a.addEventListener("click",()=>{
      visited.add(a.dataset.url);
      localStorage.setItem(visitedKey,JSON.stringify([...visited]));
      a.classList.add("visited");
    });
  });
}

renderFilters();
render();
</script>
</body>
</html>
